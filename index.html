<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    form #add-title { flex: 1; }
    input, button { font: inherit; padding: .4rem .6rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; }
    li input[type=text] { flex: 1; }
    .done { text-decoration: line-through; color: #595959; }
    .due { font-size: .875rem; color: #595959; white-space: nowrap; }
    li.overdue { background: #fdecea; border-left: 4px solid #b00020; padding-left: .5rem; }
    .overdue-label { color: #b00020; font-weight: 600; }
    #error { color: #b00020; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>To-do</h1>
  <form id="add-form">
    <input id="add-title" type="text" aria-label="New to-do title" placeholder="What needs doing?">
    <input id="add-due" type="date" aria-label="Due date (optional)">
    <button type="submit">Add</button>
  </form>
  <p id="error" role="alert"></p>
  <p id="empty" hidden>Nothing to do yet.</p>
  <ul id="list"></ul>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
